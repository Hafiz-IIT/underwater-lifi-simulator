[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="underwater-lifi-simulator"
version="0.1.0"
description="Simplified underwater optical-communication simulator covering attenuation, received power, SNR and OOK bit-error rate."
requires-python=">=3.10"
license={text="MIT"}
authors=[{name="Syed Hafiz Ali"}]

[tool.setuptools]
py-modules=["underwater_lifi_simulator"]
